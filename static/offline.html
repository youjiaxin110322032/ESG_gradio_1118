<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>目前離線</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;text-align:center;padding:24px}
    .card{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
      padding:32px 28px;border-radius:20px;max-width:360px}
    h1{margin:0 0 8px;font-size:1.6rem}
    p{margin:0 0 20px;opacity:.9;line-height:1.6}
    button{border:0;border-radius:12px;padding:12px 22px;font-size:1rem;
      background:#fff;color:#4f46e5;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 目前離線</h1>
    <p>此應用需要網路才能下載與查詢資料，請確認連線後再試一次。</p>
    <button onclick="location.reload()">重新整理</button>
  </div>
</body>
</html>
